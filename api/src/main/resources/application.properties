spring.application.name=instituto-mao-amiga-api
server.port=8080

# Banco de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:maoamigadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 para visualização no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Paginação Spring Data via DTO (formato content e page)
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
